name: Build split APKs and create release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            android/.gradle
            ~/.gradle/caches
          key: gradle-${{ hashFiles('android/**/*.gradle') }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: List APKs
        run: ls -la android/app/build/outputs/apk/release/

      - name: Resolve version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            android/app/build/outputs/apk/release/app-*-release.apk \
            --title "win11-calculator ${{ steps.version.outputs.tag }}" \
            --notes "Split per-ABI release APKs (arm64-v8a, armeabi-v7a, x86_64)."